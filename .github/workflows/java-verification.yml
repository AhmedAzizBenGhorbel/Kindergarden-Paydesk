name: Java verification
on:
  push:
    branches: [master, portfolio/paydesk-verification]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and run isolated tests
        run: mvn --batch-mode --no-transfer-progress clean test
